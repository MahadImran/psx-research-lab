name: Scheduled PSX Collector

on:
  schedule:
    # Runs during Pakistan Stock Exchange market hours (Asia/Karachi: UTC+5)
    # Target non-zero minutes (e.g. 17 and 47) to avoid GitHub Actions peak queue delays
    # Regular trading: Monday - Thursday 09:15 - 15:30 PKT (04:15 - 10:30 UTC)
    # Friday Session 1: 09:15 - 12:00 PKT (04:15 - 07:00 UTC)
    # Friday Session 2: 14:30 - 16:30 PKT (09:30 - 11:30 UTC)
    - cron: '17 4,5,6,7,8,9,10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: psx-scheduled-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Market Collection & Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Market-Hour Check & Lease Acquisition
        run: |
          echo "Market collection scheduled runner active. (Milestone 2 implementation)"
