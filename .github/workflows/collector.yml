name: Scheduled PSX Collector

on:
  schedule:
    # Runs during Pakistan Stock Exchange market hours (Asia/Karachi: UTC+5)
    # Target non-zero minutes (e.g. 17) to avoid GitHub Actions peak queue delays
    # Mon-Thu: 09:15 - 15:30 PKT (04:15 - 10:30 UTC) -> hours 4, 5, 6, 7, 8, 9, 10
    # Friday: 09:15 - 12:00 PKT (04:15 - 07:00 UTC) & 14:30 - 16:30 PKT (09:30 - 11:30 UTC)
    # EOD Reconciliation window: 17:17 PKT (12:17 UTC)
    - cron: '17 4,5,6,7,8,9,10,12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass market trading hours calendar check'
        required: false
        type: boolean
        default: false
      force_eod:
        description: 'Force End-of-Day (EOD) settlement reconciliation'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run mode (do not commit to archive repo or post to API)'
        required: false
        type: boolean
        default: false

concurrency:
  group: psx-scheduled-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: Market Collection & Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Collector Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e services/collector

      - name: Execute Collector Pipeline
        env:
          CLOUDFLARE_CLIENT_ID: ${{ secrets.CLOUDFLARE_CLIENT_ID }}
          CLOUDFLARE_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_CLIENT_SECRET }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.force_eod }}" = "true" ]; then
            ARGS="$ARGS --force-eod"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Executing collector with args: $ARGS"
          python -m services.collector.src.collector.cli run $ARGS
