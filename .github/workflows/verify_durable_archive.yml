name: Bounded Durable Archive Verification

on:
  workflow_dispatch:

concurrency:
  group: psx-archive-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Real PSX Extraction, Private Archival & Readback
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e services/collector

      - name: Execute Bounded Durable Archiving Verification
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          python -m services.collector.src.collector.verify_durable_archive
